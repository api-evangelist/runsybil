aid: runsybil
name: Runsybil
description: >-
  RunSybil is an AI-native autonomous offensive security platform. Sybil — a
  system of AI agents — continuously penetration tests live applications and
  infrastructure, finding, exploiting, and validating real vulnerabilities
  without a human in the loop. It tests live applications black-box by default
  (no source code required), integrates with GitHub and GitLab to trigger
  targeted change testing on every code push, and validates every finding
  through a multi-agent pipeline before it surfaces, aiming to eliminate triage
  and false positives. RunSybil positions as a replacement for point-in-time
  penetration testing, legacy DAST/SAST scanners, and bug bounty programs, and
  also offers white-box testing for deeper codebase exploration. Founded in 2023
  by Ari Herbert-Voss (OpenAI's first security hire) and Vlad Ionescu
  (Offensive Security Tech Lead at Meta), the company raised $40M led by Khosla
  Ventures and is trusted by security teams at Notion, Cursor, Turbopuffer,
  Baseten, and Thinking Machines Lab. No public developer API, SDK, or API
  documentation surface is published at this time.
